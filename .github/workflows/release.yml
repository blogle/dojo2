name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [master]
    tags: ["staging", "v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to publish or recover, without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Determine and prepare next patch release
        id: release
        shell: bash
        run: |
          version="$(nix develop --command just release-next-version)"
          nix develop --command just release-prepare "$version"
          if git diff --quiet -- CHANGELOG.md api/pyproject.toml api/uv.lock web/package.json; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit and tag release
        if: steps.release.outputs.created == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md api/pyproject.toml api/uv.lock web/package.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag --annotate "v${VERSION}" --message "dojo v${VERSION}"
          git push origin HEAD:master "v${VERSION}"

  publish-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install project dependencies
        run: nix develop --command just setup
      - name: Build container
        run: |
          nix develop --command just build-web
          nix build .#container
          docker load < "$(readlink -f result)"
          docker build --tag dojo-release:latest .
      - name: Publish staging image
        if: github.ref == 'refs/tags/staging' || github.ref == 'refs/heads/master'
        run: |
          docker tag dojo-release:latest ghcr.io/blogle/dojo2:staging
          docker push ghcr.io/blogle/dojo2:staging
      - name: Publish production image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag dojo-release:latest "ghcr.io/blogle/dojo2:${GITHUB_REF_NAME}"
          docker push "ghcr.io/blogle/dojo2:${GITHUB_REF_NAME}"

  publish-release-image:
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && inputs.version != '') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.prepare-release.outputs.created == 'true')
      )
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version || needs.prepare-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ env.RELEASE_VERSION }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install project dependencies
        run: nix develop --command just setup
      - name: Build container
        run: |
          nix develop --command just build-web
          nix build .#container
          docker load < "$(readlink -f result)"
          docker build --tag dojo-release:latest .
      - name: Publish production image
        run: |
          docker tag dojo-release:latest "ghcr.io/blogle/dojo2:${RELEASE_VERSION}"
          docker push "ghcr.io/blogle/dojo2:${RELEASE_VERSION}"

  create-release:
    if: |
      always() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.publish-image.result == 'success') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.publish-release-image.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.publish-release-image.result == 'success')
      )
    needs: [prepare-release, publish-image, publish-release-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || needs.prepare-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${RELEASE_VERSION}" --title "dojo ${RELEASE_VERSION}" --generate-notes --verify-tag
