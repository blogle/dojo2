name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [master]
    tags: ["staging", "v*"]

permissions:
  contents: read

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install project dependencies
        run: nix develop --command just setup
      - name: Build container
        run: |
          nix develop --command just build-web
          nix build .#container
          docker load < "$(readlink -f result)"
          docker build --tag dojo-release:latest .
      - name: Publish staging image
        if: github.ref == 'refs/tags/staging' || github.ref == 'refs/heads/master'
        run: |
          docker tag dojo-release:latest ghcr.io/blogle/dojo2:staging
          docker push ghcr.io/blogle/dojo2:staging
      - name: Publish production image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag dojo-release:latest "ghcr.io/blogle/dojo2:${GITHUB_REF_NAME}"
          docker push "ghcr.io/blogle/dojo2:${GITHUB_REF_NAME}"
