name: Release

concurrency:
  group: dojo-release-${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
  cancel-in-progress: false

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact master commit to publish
        required: true
        type: string

permissions:
  contents: write

env:
  TARGET_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      created: ${{ steps.version.outputs.created }}
      version: ${{ steps.version.outputs.version }}
      complete: ${{ steps.version.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
          fetch-depth: 0
      - name: Determine release introduced by this commit
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch origin master
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/master
          parent="$(git rev-parse "${TARGET_COMMIT}^")"
          git show "${parent}:CHANGELOG.md" > /tmp/parent-CHANGELOG.md
          published_tags=()
          associated_tags=()
          conflicting_tags=()
          while IFS= read -r tag; do
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            published_tags+=(--published-tag "$tag")
            tag_commit="$(git rev-parse "${tag}^{commit}")"
            if [[ "$tag_commit" == "$TARGET_COMMIT" ]]; then
              associated_tags+=(--associated-tag "$tag")
            else
              tag_parent="$(git rev-parse "${tag_commit}^" 2>/dev/null || true)"
              if [[ -n "$tag_parent" ]] && git show "${tag_parent}:CHANGELOG.md" > /tmp/tag-parent-CHANGELOG.md 2>/dev/null && git show "${tag_commit}:CHANGELOG.md" > /tmp/tag-CHANGELOG.md 2>/dev/null; then
                tag_introduced="$(python3 scripts/release.py changelog-introduces /tmp/tag-parent-CHANGELOG.md /tmp/tag-CHANGELOG.md "${tag#v}")"
              else
                tag_introduced=false
              fi
              if [[ "$tag_introduced" != true ]]; then
                conflicting_tags+=(--conflicting-tag "$tag")
              fi
            fi
          done < <(git tag --list 'v*')
          version="$(python3 scripts/release.py changelog-delta /tmp/parent-CHANGELOG.md CHANGELOG.md "${published_tags[@]}" "${associated_tags[@]}" "${conflicting_tags[@]}")"
          echo "commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          if [[ -z "$version" ]]; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo 'This master commit introduced no generated release; staging will still be updated.'
          else
            echo 'created=true' >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            tag="v${version}"
            if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
              python3 scripts/release.py validate-tag-target "$(git rev-parse "${tag}^{commit}")" "$TARGET_COMMIT" "$version"
              if release_body="$(gh release view "$tag" --json body --jq .body 2>/dev/null)"; then
                release_query_succeeded=true
              else
                release_query_succeeded=false
                release_body=""
              fi
              python3 scripts/release.py changelog-entry CHANGELOG.md "$version" > /tmp/release-notes.md
              if source_digest="$(gh api --paginate --jq ".[] | select((.metadata.container.tags // []) | index(\"git-${TARGET_COMMIT}\")) | .name" /users/blogle/packages/container/dojo2/versions 2>/dev/null)" && release_digest="$(gh api --paginate --jq ".[] | select((.metadata.container.tags // []) | index(\"${tag}\")) | .name" /users/blogle/packages/container/dojo2/versions 2>/dev/null)"; then
                package_query_succeeded=true
              else
                package_query_succeeded=false
                source_digest=""
                release_digest=""
              fi
              expected_body="$(< /tmp/release-notes.md)"
              if [[ "$release_query_succeeded" == true && "$package_query_succeeded" == true && "$release_body" == "$expected_body" && -n "$source_digest" && "$source_digest" == "$release_digest" ]]; then
                echo 'complete=true' >> "$GITHUB_OUTPUT"
                echo "Release $tag, notes, and promoted image digest are complete; release publication jobs will be skipped."
              else
                echo 'complete=false' >> "$GITHUB_OUTPUT"
              fi
            else
              echo 'complete=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  publish-staging:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MASTER_COMMIT: ${{ needs.prepare-release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          fetch-depth: 0
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether staging needs an update
        id: staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skip=false
          build=true
          if source_digest="$(gh api --paginate --jq ".[] | select((.metadata.container.tags // []) | index(\"git-${MASTER_COMMIT}\")) | .name" /users/blogle/packages/container/dojo2/versions 2>/dev/null)" && staging_digest="$(gh api --paginate --jq '.[] | select((.metadata.container.tags // []) | index("staging")) | .name' /users/blogle/packages/container/dojo2/versions 2>/dev/null)"; then
            if [[ -n "$source_digest" ]]; then
              build=false
              remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
              if [[ -z "$remote_master" ]]; then
                echo 'Could not read master ref; proceeding with staging repair.'
              else
                target_is_current_master=false
                if [[ "$remote_master" == "$MASTER_COMMIT" ]]; then
                  target_is_current_master=true
                fi
                staging_needed="$(python3 scripts/release.py staging-needed "$target_is_current_master" "$source_digest" "$staging_digest")"
                if [[ "$staging_needed" == false ]]; then
                  skip=true
                  echo 'Staging update is unnecessary for the current master and image state.'
                  if [[ "$target_is_current_master" == false ]]; then
                    echo "Master advanced to $remote_master; staging remains unchanged."
                  fi
                else
                  echo 'Staging differs from the exact source image and will be repaired.'
                fi
              fi
            else
              echo 'The immutable source image is missing; it will be built.'
            fi
          else
            echo 'GHCR state is unavailable or could not be queried; proceeding with staging repair.'
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.staging.outputs.skip != 'true' && steps.staging.outputs.build == 'true'
      - name: Install project dependencies
        if: steps.staging.outputs.skip != 'true' && steps.staging.outputs.build == 'true'
        run: nix develop --command just setup
      - name: Build missing immutable source image
        if: steps.staging.outputs.skip != 'true' && steps.staging.outputs.build == 'true'
        run: |
          source_image="ghcr.io/blogle/dojo2:git-${MASTER_COMMIT}"
          if docker manifest inspect "$source_image" >/dev/null 2>&1; then
            echo "Source image $source_image appeared while preparing; reusing it."
          else
            nix develop --command just build-web
            DOJO_BUILD_SHA="$MASTER_COMMIT" nix build .#container --impure
            docker load < "$(readlink -f result)"
            docker build --build-arg DOJO_BUILD_SHA="$MASTER_COMMIT" --tag "$source_image" .
            docker push "$source_image"
          fi
      - name: Move staging only when target remains current master
        if: steps.staging.outputs.skip != 'true'
        run: |
          source_image="ghcr.io/blogle/dojo2:git-${MASTER_COMMIT}"
          docker pull "$source_image"
          # An older delayed publication may build its exact image, but it must
          # not move staging behind the current master ref.
          remote_master="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$remote_master" != "$MASTER_COMMIT" ]]; then
            printf 'Master advanced to %s; leaving staging unchanged.\n' "$remote_master"
            exit 0
          fi
          docker tag "$source_image" ghcr.io/blogle/dojo2:staging
          docker push ghcr.io/blogle/dojo2:staging

  tag-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.created == 'true' && needs.prepare-release.outputs.complete != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MASTER_COMMIT: ${{ needs.prepare-release.outputs.commit }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          fetch-depth: 0
      - name: Tag exact pushed commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            test "$(git rev-parse "${tag}^{commit}")" = "$MASTER_COMMIT"
          else
            git tag --annotate "$tag" --message "dojo $tag" "$MASTER_COMMIT"
            git push origin "$tag"
          fi

  publish-release-image:
    needs: [prepare-release, publish-staging, tag-release]
    if: needs.prepare-release.outputs.created == 'true' && needs.prepare-release.outputs.complete != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MASTER_COMMIT: ${{ needs.prepare-release.outputs.commit }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          fetch-depth: 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact master image
        run: |
          source_image="ghcr.io/blogle/dojo2:git-${MASTER_COMMIT}"
          release_image="ghcr.io/blogle/dojo2:v${VERSION}"
          docker pull "$source_image"
          docker tag "$source_image" "$release_image"
          docker push "$release_image"

  create-release:
    needs: [prepare-release, publish-release-image, tag-release]
    if: needs.prepare-release.outputs.created == 'true' && needs.prepare-release.outputs.complete != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          fetch-depth: 1
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Create or refresh release from exact changelog entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${VERSION}"
          nix develop --command python3 scripts/release.py changelog-entry CHANGELOG.md "$VERSION" > /tmp/release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "dojo $tag" --notes-file /tmp/release-notes.md
          else
            gh release create "$tag" --title "dojo $tag" --notes-file /tmp/release-notes.md --verify-tag
          fi
