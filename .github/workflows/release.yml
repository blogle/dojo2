name: Release

concurrency:
  group: dojo-master-release
  cancel-in-progress: false

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      created: ${{ steps.version.outputs.created }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Read decided version from checked-in changelog
        id: version
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="$(nix develop --command python3 scripts/release.py changelog-version CHANGELOG.md)"
          if [[ -z "$version" ]]; then
            echo 'No unreleased changelog section; this master commit has no release to publish.'
            echo 'created=false' >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  tag-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      MASTER_COMMIT: ${{ needs.prepare-release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Tag exact master commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            test "$(git rev-parse "${tag}^{commit}")" = "$MASTER_COMMIT"
          else
            git tag --annotate "$tag" --message "dojo $tag" "$MASTER_COMMIT"
            git push origin "$tag"
          fi

  publish-image:
    needs: [prepare-release, tag-release]
    if: needs.prepare-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      MASTER_COMMIT: ${{ needs.prepare-release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and promote immutable release image
        run: |
          source_image="ghcr.io/blogle/dojo2:git-${MASTER_COMMIT}"
          release_image="ghcr.io/blogle/dojo2:v${VERSION}"
          if ! docker manifest inspect "$source_image" >/dev/null 2>&1; then
            nix develop --command just build-web
            DOJO_BUILD_SHA="$MASTER_COMMIT" nix build .#container --impure
            docker load < "$(readlink -f result)"
            docker build --build-arg DOJO_BUILD_SHA="$MASTER_COMMIT" --tag "$source_image" .
            docker push "$source_image"
          else
            docker pull "$source_image"
          fi
          docker tag "$source_image" "$release_image"
          docker push "$release_image"

  create-release:
    needs: [prepare-release, tag-release, publish-image]
    if: needs.prepare-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Create GitHub release from checked-in changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix develop --command python3 scripts/release.py changelog-entry CHANGELOG.md "$VERSION" > /tmp/release-notes.md
          gh release create "v${VERSION}" --title "dojo v${VERSION}" --notes-file /tmp/release-notes.md --verify-tag
