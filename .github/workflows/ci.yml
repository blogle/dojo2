name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      ref:
        description: Candidate branch to validate
        required: true
        type: string
      sha:
        description: Candidate commit to mark validated
        required: true
        type: string
      context:
        description: Unique commit-status context for this validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate release directive
        if: github.event_name == 'pull_request'
        run: python3 scripts/release.py validate-pr "$GITHUB_EVENT_PATH"
      - uses: DeterminateSystems/nix-installer-action@main
      # Cache downloaded pnpm packages across independent runners; node_modules stays runner-local.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install project dependencies
        run: nix develop --command just setup
      - name: Run static and architecture checks
        run: nix develop --command just static-check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.head.sha }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Install API dependencies
        run: nix develop --command just setup-api
      - name: Run backend tests and package build
        run: nix develop --command just backend-check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.head.sha }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install web dependencies
        run: nix develop --command just setup-web
      - name: Run web tests and build
        run: nix develop --command just web-check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.head.sha }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install project dependencies
        run: nix develop --command just setup
      - name: Run E2E tests
        run: nix develop --command just test-e2e

  docs-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.head.sha }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build docs and validate container
        run: nix develop --command just docs-container-check

  verify:
    if: always()
    needs: [static, backend, web, e2e, docs-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compute aggregate validation result
        id: aggregate
        continue-on-error: true
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          WEB_RESULT: ${{ needs.web.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          DOCS_CONTAINER_RESULT: ${{ needs.docs-container.result }}
        run: |
          for result in "$STATIC_RESULT" "$BACKEND_RESULT" "$WEB_RESULT" "$E2E_RESULT" "$DOCS_CONTAINER_RESULT"; do
            if [[ "$result" != success ]]; then
              printf 'Required validation job did not succeed: %s\n' "$result"
              exit 1
            fi
          done
      - name: Fail aggregate gate when any validation job failed
        if: steps.aggregate.outcome != 'success'
        run: exit 1

  candidate-image:
    needs: verify
    if: needs.verify.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish workflow-dispatch candidate image
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: ops/container/publish-image.sh "$CANDIDATE_SHA"
      - name: Publish pull request candidate image
        if: github.event_name == 'pull_request'
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: ops/container/publish-image.sh "$CANDIDATE_SHA"
      - name: Publish pull request image
        if: github.event_name == 'pull_request'
        run: |
          docker tag "ghcr.io/blogle/dojo2:git-${{ github.event.pull_request.head.sha }}" "ghcr.io/blogle/dojo2:pr-${{ github.event.pull_request.number }}"
          docker push "ghcr.io/blogle/dojo2:pr-${{ github.event.pull_request.number }}"

  candidate-validation-status:
    needs: [verify, candidate-image]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish candidate validation status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_STATE: ${{ needs.verify.result == 'success' && needs.candidate-image.result == 'success' && 'success' || 'failure' }}
        run: |
          description='Candidate CI failed'
          if [[ "$VALIDATION_STATE" == "success" ]]; then
            description='Candidate CI passed'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${{ inputs.sha }}" \
            -f state="$VALIDATION_STATE" \
            -f context='${{ inputs.context }}' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - name: Fail candidate validation when tests or image publication fail
        if: env.VALIDATION_STATE != 'success'
        run: exit 1
