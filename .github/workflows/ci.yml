name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      ref:
        description: Candidate branch to validate
        required: true
        type: string
      sha:
        description: Candidate commit to mark validated
        required: true
        type: string
      context:
        description: Unique commit-status context for this validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate release directive
        if: github.event_name == 'pull_request'
        run: python3 scripts/release.py validate-pr "$GITHUB_EVENT_PATH"
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Install project dependencies
        run: nix develop --command just setup
      - name: Run canonical CI command
        id: candidate-ci
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: nix develop --command just ci
      - name: Publish candidate validation status
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_STATE: ${{ steps.candidate-ci.outcome == 'success' && 'success' || 'failure' }}
        run: |
          description='Candidate CI failed'
          if [[ "$VALIDATION_STATE" == "success" ]]; then
            description='Candidate CI passed'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${{ inputs.sha }}" \
            -f state="$VALIDATION_STATE" \
            -f context='${{ inputs.context }}' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - name: Return candidate CI result
        if: github.event_name == 'workflow_dispatch' && steps.candidate-ci.outcome != 'success'
        run: exit 1

  publish-pr-image:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install project dependencies
        run: nix develop --command just setup
      - name: Build or reuse immutable container
        run: |
          build_sha="$GITHUB_SHA"
          source_image="ghcr.io/blogle/dojo2:git-${build_sha}"
          if docker manifest inspect "$source_image" >/dev/null 2>&1; then
            printf 'Reusing existing immutable image %s.\n' "$source_image"
            docker pull "$source_image"
          else
            nix develop --command just build-web
            DOJO_BUILD_SHA="$build_sha" nix build .#container --impure
            docker load < "$(readlink -f result)"
            docker build --build-arg DOJO_BUILD_SHA="$build_sha" --tag "$source_image" .
            docker push "$source_image"
          fi
      - name: Publish pull request image
        run: |
          docker tag "ghcr.io/blogle/dojo2:git-${GITHUB_SHA}" "ghcr.io/blogle/dojo2:pr-${{ github.event.pull_request.number }}"
          docker push "ghcr.io/blogle/dojo2:pr-${{ github.event.pull_request.number }}"
