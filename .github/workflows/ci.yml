name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run canonical CI command
        run: nix develop --command just ci

  publish-image:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        run: nix build .#container
      - name: Publish staging image
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          docker load < "$(readlink -f result)"
          docker tag dojo:latest ghcr.io/blogle/dojo:staging
          docker push ghcr.io/blogle/dojo:staging
      - name: Publish production image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker load < "$(readlink -f result)"
          docker tag dojo:latest "ghcr.io/blogle/dojo:${GITHUB_REF_NAME}"
          docker push "ghcr.io/blogle/dojo:${GITHUB_REF_NAME}"
