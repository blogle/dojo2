name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Install project dependencies
        run: nix develop --command just setup
      - name: Run canonical CI command
        run: nix develop --command just ci

  publish-image:
    needs: verify
    if: >-
      always() && github.event_name == 'push' &&
      (github.ref == 'refs/tags/staging' || startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        run: nix build .#container
      - name: Publish staging image
        if: github.ref == 'refs/tags/staging' || github.ref == 'refs/heads/master'
        run: |
          docker load < "$(readlink -f result)"
          docker tag dojo:latest ghcr.io/blogle/dojo2:staging
          docker push ghcr.io/blogle/dojo2:staging
      - name: Publish production image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker load < "$(readlink -f result)"
          docker tag dojo:latest "ghcr.io/blogle/dojo2:${GITHUB_REF_NAME}"
          docker push "ghcr.io/blogle/dojo2:${GITHUB_REF_NAME}"
