name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Install project dependencies
        run: nix develop --command just setup
      - name: Run canonical CI command
        run: nix develop --command just ci

  publish-pr-image:
    needs: verify
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install project dependencies
        run: nix develop --command just setup
      - name: Build container
        run: |
          nix develop --command just build-web
          DOJO_BUILD_SHA="$GITHUB_SHA" nix build .#container --impure
          docker load < "$(readlink -f result)"
          docker build --build-arg DOJO_BUILD_SHA="$GITHUB_SHA" --tag dojo-release:latest .
      - name: Publish pull request image
        run: |
          docker tag dojo-release:latest "ghcr.io/blogle/dojo2:git-${GITHUB_SHA}"
          docker push "ghcr.io/blogle/dojo2:git-${GITHUB_SHA}"
          docker tag dojo-release:latest "ghcr.io/blogle/dojo2:pr-${{ github.event.pull_request.number }}"
          docker push "ghcr.io/blogle/dojo2:pr-${{ github.event.pull_request.number }}"
