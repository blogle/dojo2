# Copy this file, replace every REPLACE_* value, and restore only to a newly
# created PVC. Never point the Job at dojo-data.
apiVersion: batch/v1
kind: Job
metadata:
  name: dojo-restore-REPLACE_ID
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: materialize
        image: REPLACE_IMAGE_DIGEST
        command: [/bin/bash, -cu]
         args:
         - |
           /bin/dojo-backup-upload restore --snapshot-id 'REPLACE_RESTIC_SNAPSHOT_ID' --target-directory /materialized --internal-api-url http://dojo --internal-token-file /backup-status/token --restic-password-file /restic-secrets/restic-password --repository-path dojo/restic
           /bin/dojo-backup restore /materialized/stage/dojo.duckdb /materialized/stage/dojo.duckdb.manifest.json /data/dojo.duckdb
         volumeMounts:
        - name: data
          mountPath: /data
        - name: materialized
          mountPath: /materialized
         - name: backup-status
           mountPath: /backup-status
           readOnly: true
        - name: restic-secrets
          mountPath: /restic-secrets
          readOnly: true
      - name: migrate
        image: REPLACE_IMAGE_DIGEST
        command: [/bin/dojo-migrate, /data/dojo.duckdb]
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: verify
        image: REPLACE_IMAGE_DIGEST
        command: [/bin/dojo-backup, prepare, /data/dojo.duckdb, /verify/dojo.duckdb, --image-digest, REPLACE_IMAGE_DIGEST, --source-snapshot, REPLACE_RESTIC_SNAPSHOT_ID]
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: verify
          mountPath: /verify
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: REPLACE_NEW_RESTORE_PVC
      - name: materialized
        emptyDir: {}
      - name: verify
        emptyDir: {}
       - name: restic-secrets
         secret:
           secretName: dojo-backup-restic
       - name: backup-status
         secret:
           secretName: dojo-backup-status
