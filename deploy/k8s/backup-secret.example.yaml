apiVersion: v1
kind: Secret
metadata:
  name: dojo-backup-credentials
type: Opaque
stringData:
  restic-password: replace-with-a-long-random-password
  service-account.json: replace-with-google-service-account-json
  rclone.conf: |
    [gdrive]
    type = drive
    scope = drive.file
    service_account_file = /backup-secrets/service-account.json
    root_folder_id = replace-with-shared-drive-folder-id
