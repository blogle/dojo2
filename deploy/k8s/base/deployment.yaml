apiVersion: apps/v1
kind: Deployment
metadata:
  name: dojo
  labels:
    app: dojo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dojo
  template:
    metadata:
      labels:
        app: dojo
    spec:
      automountServiceAccountToken: false
      serviceAccountName: dojo-backup-trigger
      initContainers:
      - name: migrate
        image: ghcr.io/blogle/dojo2
        imagePullPolicy: IfNotPresent
        command: ["/bin/dojo-migrate", "/data/dojo.duckdb"]
        env:
        - name: APP_ENV
          value: production
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: dojo
        image: ghcr.io/blogle/dojo2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: APP_ENV
          value: production
        - name: DUCKDB_PATH
          value: /data/dojo.duckdb
        - name: FRONTEND_BASE_URL
          value: http://localhost:8000
        - name: GOOGLE_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: dojo-google-oauth
              key: client-id
        - name: GOOGLE_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: dojo-google-oauth
              key: client-secret
        - name: GOOGLE_OAUTH_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: dojo-google-oauth
              key: redirect-uri
        - name: GOOGLE_PICKER_API_KEY
          valueFrom:
            secretKeyRef:
              name: dojo-google-picker
              key: api-key
        - name: GOOGLE_PICKER_APP_ID
          valueFrom:
            secretKeyRef:
              name: dojo-google-picker
              key: app-id
        - name: DOJO_CREDENTIAL_ENCRYPTION_KEY_FILE
          value: /credentials/encryption-key
        - name: BACKUP_STATUS_TOKEN_FILE
          value: /backup-status/token
        volumeMounts:
        - name: data
          mountPath: /data
        - name: credentials
          mountPath: /credentials
          readOnly: true
        - name: backup-status
          mountPath: /backup-status
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
      - name: backup-trigger
        image: ghcr.io/blogle/dojo2
        imagePullPolicy: Always
        command: [/bin/dojo-backup-trigger]
        env:
        - name: BACKUP_TRIGGER_TOKEN_FILE
          value: /backup-status/token
        - name: BACKUP_KUBERNETES_API_URL
          value: https://kubernetes.default.svc
        - name: BACKUP_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: BACKUP_KUBERNETES_CRONJOB_NAME
          value: dojo-backup
        - name: BACKUP_KUBERNETES_TOKEN_FILE
          value: /var/run/secrets/dojo-backup-trigger/token
        - name: BACKUP_KUBERNETES_CA_FILE
          value: /var/run/secrets/dojo-backup-trigger/ca.crt
        volumeMounts:
        - name: backup-status
          mountPath: /backup-status
          readOnly: true
        - name: backup-trigger-kubernetes
          mountPath: /var/run/secrets/dojo-backup-trigger
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dojo-data
      - name: credentials
        secret:
          secretName: dojo-backup-credentials
          items:
          - key: encryption-key
            path: encryption-key
      - name: backup-status
        secret:
          secretName: dojo-backup-status
          optional: true
      - name: backup-trigger-kubernetes
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
      securityContext:
        fsGroup: 1000
