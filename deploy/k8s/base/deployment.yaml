apiVersion: apps/v1
kind: Deployment
metadata:
  name: dojo
  labels:
    app: dojo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dojo
  template:
    metadata:
      labels:
        app: dojo
    spec:
      initContainers:
      - name: backup-before-migrate
        image: ghcr.io/blogle/dojo2
        imagePullPolicy: IfNotPresent
        command: [/bin/bash, -cu]
        args:
        - |
          if [[ ! -f /data/dojo.duckdb ]]; then exit 0; fi
          /bin/dojo-backup prepare /data/dojo.duckdb /stage/dojo.duckdb --image-digest "${DOJO_RELEASE_IMAGE}" --source-snapshot pre-migration
          restic backup /stage --tag dojo --tag pre-migration --tag "${DOJO_RELEASE_IMAGE}"
          restic check
        env:
        - name: DOJO_RELEASE_IMAGE
          value: ghcr.io/blogle/dojo2
        - name: RESTIC_REPOSITORY
          value: rclone:gdrive:dojo/restic
        - name: RESTIC_PASSWORD_FILE
          value: /backup-secrets/restic-password
        - name: RCLONE_CONFIG
          value: /backup-secrets/rclone.conf
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: backup-stage
          mountPath: /stage
        - name: backup-secrets
          mountPath: /backup-secrets
          readOnly: true
      - name: migrate
        image: ghcr.io/blogle/dojo2
        imagePullPolicy: IfNotPresent
        command: ["/bin/dojo-migrate", "/data/dojo.duckdb"]
        env:
        - name: APP_ENV
          value: production
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: dojo
        image: ghcr.io/blogle/dojo2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: APP_ENV
          value: production
        - name: DUCKDB_PATH
          value: /data/dojo.duckdb
        - name: FRONTEND_BASE_URL
          value: http://localhost:8000
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dojo-data
      - name: backup-stage
        emptyDir: {}
      - name: backup-secrets
        secret:
          secretName: dojo-backup-credentials
      securityContext:
        fsGroup: 1000
