apiVersion: apps/v1
kind: Deployment
metadata:
  name: dojo
  labels:
    app: dojo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dojo
  template:
    metadata:
      labels:
        app: dojo
    spec:
      initContainers:
      - name: migrate
        image: ghcr.io/blogle/dojo2
        imagePullPolicy: IfNotPresent
        command: ["/bin/dojo-migrate", "/data/dojo.duckdb"]
        env:
        - name: APP_ENV
          value: production
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: dojo
        image: ghcr.io/blogle/dojo2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: APP_ENV
          value: production
        - name: DUCKDB_PATH
          value: /data/dojo.duckdb
        - name: FRONTEND_BASE_URL
          value: http://localhost:8000
        - name: BACKUP_SERVICE_ACCOUNT_EMAIL
          valueFrom:
            configMapKeyRef:
              name: dojo-backup-config
              key: service-account-email
              optional: true
        - name: BACKUP_SERVICE_ACCOUNT_FILE
          value: /google-backup/service-account.json
        - name: BACKUP_STATUS_TOKEN_FILE
          value: /backup-status/token
        volumeMounts:
        - name: data
          mountPath: /data
        - name: google-backup
          mountPath: /google-backup
          readOnly: true
        - name: backup-status
          mountPath: /backup-status
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dojo-data
      - name: google-backup
        secret:
          secretName: dojo-backup-google
          optional: true
      - name: backup-status
        secret:
          secretName: dojo-backup-status
          optional: true
      securityContext:
        fsGroup: 1000
