apiVersion: batch/v1
kind: CronJob
metadata:
  name: dojo-backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: dojo-backup
          restartPolicy: Never
          containers:
          - name: orchestrator
            image: ghcr.io/blogle/dojo2
            command: [/bin/dojo-snapshot-backup]
            env:
            - name: DOJO_BACKUP_STATUS_URL
              value: http://dojo/api/internal/backup-runs
            - name: DOJO_BACKUP_STATUS_TOKEN_FILE
              value: /backup-status/token
            volumeMounts:
            - name: backup-status
              mountPath: /backup-status
              readOnly: true
          volumes:
          - name: backup-status
            secret:
              secretName: dojo-backup-status
              optional: true
