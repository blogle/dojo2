apiVersion: v1
kind: ServiceAccount
metadata:
  name: dojo-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dojo-backup
rules:
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dojo-backup
subjects:
- kind: ServiceAccount
  name: dojo-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dojo-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dojo-backup-snapshot-classes
rules:
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshotclasses"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dojo-backup-snapshot-classes
subjects:
- kind: ServiceAccount
  name: dojo-backup
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dojo-backup-snapshot-classes
