apiVersion: apps/v1
kind: Deployment
metadata:
  name: dojo
spec:
  template:
    spec:
      initContainers:
      - name: fix-permissions
        image: ghcr.io/blogle/dojo2
        imagePullPolicy: Always
        command: ["/bin/sh", "-c", "chown -R 1000:1000 /data"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /data
      - name: migrate
        image: ghcr.io/blogle/dojo2
        imagePullPolicy: IfNotPresent
        command: ["/bin/dojo-migrate", "/data/dojo.duckdb"]
        env:
        - name: APP_ENV
          value: production
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: dojo
        imagePullPolicy: Always
        env:
        - name: FRONTEND_BASE_URL
          value: https://dojo.thejeffer.net
        - name: CORS_ALLOWED_ORIGINS
          value: https://dojo.thejeffer.net
        - name: GOOGLE_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              key: GOOGLE_OAUTH_CLIENT_ID
              name: dojo-google-oauth
        - name: GOOGLE_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: GOOGLE_OAUTH_CLIENT_SECRET
              name: dojo-google-oauth
        - name: GOOGLE_OAUTH_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              key: GOOGLE_OAUTH_REDIRECT_URI
              name: dojo-google-oauth
        - name: APP_ENV
          value: production
        - name: DUCKDB_PATH
          value: /data/dojo.duckdb
        - name: BACKUP_SERVICE_ACCOUNT_EMAIL
          valueFrom:
            configMapKeyRef:
              name: dojo-backup-config
              key: service-account-email
              optional: true
        - name: BACKUP_SERVICE_ACCOUNT_FILE
          value: /google-backup/service-account.json
        - name: BACKUP_STATUS_TOKEN_FILE
          value: /backup-status/token
        volumeMounts:
        - name: data
          mountPath: /data
        - name: google-backup
          mountPath: /google-backup
          readOnly: true
        - name: backup-status
          mountPath: /backup-status
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dojo-prod-data-zfs
      - name: google-backup
        secret:
          secretName: dojo-backup-google
          optional: true
      - name: backup-status
        secret:
          secretName: dojo-backup-status
          optional: true
